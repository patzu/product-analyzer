[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "image-folder-analyzer"
version = "0.1.0"
description = "Classical computer-vision inspection and mock sorting prototype"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.9,<5", "pandas>=2.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
ml = ["torch>=2.4", "ultralytics>=8.3"]

[project.scripts]
vision-sorter = "vision_sorter.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
